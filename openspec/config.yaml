# openspec/config.yaml
schema: spec-driven

context: |
  Project: api-portal — "Servicio de Procesadores" (FastAPI), item #9 of the
  Portal de Innovación master backlog. Brownfield within an existing
  ecosystem: subordinate to inherited ADRs at L:\App_Portal\adrs\ (0001-0010).
  New ADRs live locally at .\adrs\, numbered from 0011 (0011-0015 exist).
  Stack: Python + FastAPI (per TECH-DESIGN.md); no packaging/tooling files
  committed yet (no pyproject.toml/requirements.txt/CI as of this init).
  Architecture: app/core (pipeline-agnostic) + app/procesadores/{key}
  (self-contained per-processor packages) + registry.py + main.py.
  Authoritative docs: PRD.md, TECH-DESIGN.md, BACKLOG.md (repo root).

# Strict TDD cancelado — decisión del usuario, 2026-08-17, desde el ítem #3.
# Los ítems #1 y #2 se construyeron bajo Strict TDD y conservan sus tests;
# nada de lo ya entregado se quita.
#
# Qué queda DESACTIVADO:
#   - El test ya no precede al código. Implementación directa.
#   - No se escriben tests estructurales (AST) ni de caos.
#   - No se provoca el rojo a propósito (perturbar y restaurar).
#   - No se escriben aserciones complejas ni auditorías extremas.
#
# Qué SIGUE VIGENTE, sin cambios:
#   - La cadena SDD completa: explore -> propose -> spec -> design -> tasks
#     -> apply -> verify -> archive. No se saltea ninguna fase.
#   - Tests de comportamiento que prueben que el ítem hace lo que dice.
#   - ruff y mypy en cada ciclo.
strict_tdd: false

testing:
  test_command: "uv run pytest"
  build_command: "uv run ruff check . && uv run ruff format --check . && uv run mypy app tests"
  coverage_threshold: 0
  notes: >
    Tooling scaffolded by esqueleto-servicio-arranque-seguro (BACKLOG item
    #1): uv-managed pyproject.toml + uv.lock, pytest + pytest-cov + httpx
    (FastAPI TestClient) for unit/integration, ruff for lint/format, mypy
    for type checking.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect inherited portal ADRs (L:\App_Portal\adrs\); this repo's ADRs
      are subordinate and numbered from 0011
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - core/ must never import from procesadores/ (architecture invariant,
      see BACKLOG item #13)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - First task of the first change MUST scaffold pytest/tooling since none
      exists yet
  apply:
    guidelines:
      - Follow existing code patterns once established
      - Every route per processor must delegate to the common pipeline, never
        reimplement it
    tdd: false          # Strict TDD desactivado — ver la nota junto a strict_tdd arriba
    test_command: "uv run pytest"
  verify:
    test_command: "uv run pytest"
    build_command: "uv run ruff check . && uv run ruff format --check . && uv run mypy app tests"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
